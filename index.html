<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Moon Games | Eternal Nebula — Sade & Güçlü</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&family=Orbitron:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030305;
            font-family: 'Inter', sans-serif;
            color: #f0f0f0;
            overflow-x: hidden;
        }

        /* Sade ama derin arka plan */
        .bg-aura {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 10%, #0b0b12, #010101);
            z-index: -2;
        }
        .noise {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }

        /* ana yapı */
        .wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 32px 28px 60px;
        }

        /* navbar – sade ve neon dokunuş */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: rgba(5, 5, 15, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            border: 1px solid rgba(244, 191, 8, 0.25);
            margin-bottom: 48px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        .logo {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f4bf08, #ffdf8c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .admin-badge {
            background: rgba(244,191,8,0.12);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(244,191,8,0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-badge i {
            margin-right: 6px;
            color: #f4bf08;
        }
        .admin-badge:hover {
            background: rgba(244,191,8,0.25);
            border-color: #f4bf08;
        }

        /* 2 sütunlu ana alan */
        .dashboard {
            display: grid;
            grid-template-columns: 1.5fr 0.9fr;
            gap: 32px;
        }

        /* cam kartlar */
        .glass-card {
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(14px);
            border-radius: 40px;
            border: 1px solid rgba(244, 191, 8, 0.2);
            overflow: hidden;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .glass-card:hover {
            border-color: rgba(244, 191, 8, 0.55);
            box-shadow: 0 20px 35px -12px rgba(244,191,8,0.15);
        }
        .card-header {
            padding: 24px 28px 12px 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .card-header i {
            font-size: 28px;
            color: #f4bf08;
        }
        .card-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0px;
        }
        .card-body {
            padding: 22px 28px 28px;
        }

        /* sohbet alanı */
        .chat-area {
            height: 460px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
            padding-right: 6px;
        }
        .message {
            max-width: 86%;
            padding: 12px 18px;
            border-radius: 24px;
            animation: fadeSlide 0.25s ease;
            word-break: break-word;
        }
        .msg-other {
            background: rgba(25, 25, 40, 0.85);
            align-self: flex-start;
            border-left: 3px solid #f4bf08;
            border-radius: 20px 20px 20px 6px;
        }
        .msg-me {
            background: linear-gradient(115deg, #f4bf08, #e6b000);
            color: #0a0a0a;
            align-self: flex-end;
            border-radius: 20px 20px 6px 20px;
            font-weight: 500;
            box-shadow: 0 6px 14px rgba(244,191,8,0.3);
        }
        .msg-name {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .msg-time {
            font-size: 0.6rem;
            opacity: 0.7;
        }
        .msg-text {
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .msg-me .msg-name {
            color: #1e1a04;
        }

        /* inputlar */
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-neon {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(244, 191, 8, 0.35);
            border-radius: 34px;
            padding: 14px 20px;
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            color: white;
            transition: 0.2s;
        }
        .input-neon:focus {
            outline: none;
            border-color: #f4bf08;
            box-shadow: 0 0 12px rgba(244,191,8,0.4);
        }
        .nick-input {
            width: 135px;
        }
        .msg-input {
            flex: 1;
        }
        .glow-btn {
            background: #f4bf08;
            border: none;
            border-radius: 40px;
            padding: 0 30px;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            color: #0c0b0b;
        }
        .glow-btn:hover {
            background: #ffd452;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(244,191,8,0.4);
        }

        /* başvuru formu */
        .staff-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(244, 191, 8, 0.3);
            border-radius: 28px;
            padding: 14px 20px;
            font-family: 'Inter', monospace;
            color: white;
            margin-bottom: 20px;
        }
        .staff-field:focus {
            border-color: #f4bf08;
            outline: none;
        }
        .full-btn {
            width: 100%;
            justify-content: center;
            padding: 14px;
        }

        /* admin panel (gizli) */
        .admin-panel {
            display: none;
            margin-top: 48px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid #f4bf08;
        }
        .apps-container {
            max-height: 320px;
            overflow-y: auto;
            padding: 20px 28px;
        }
        .app-item {
            background: rgba(20, 20, 32, 0.7);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 4px solid #f4bf08;
        }
        .app-user {
            font-weight: 800;
            color: #f4bf08;
        }

        /* animasyon ve scroll */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a24;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f4bf08;
            border-radius: 8px;
        }

        /* responsive */
        @media (max-width: 880px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .wrapper {
                padding: 20px 20px 50px;
            }
            .navbar {
                padding: 12px 20px;
            }
        }
        @media (max-width: 550px) {
            .input-row {
                flex-direction: column;
            }
            .nick-input, .msg-input, .glow-btn {
                width: 100%;
            }
            .glow-btn {
                justify-content: center;
                padding: 14px;
            }
            .card-body {
                padding: 18px;
            }
        }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2eff7a;
            border-radius: 50%;
            box-shadow: 0 0 6px #2eff7a;
            margin-right: 8px;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        .footer-note {
            text-align: center;
            margin-top: 50px;
            font-size: 0.7rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="bg-aura"></div>
<div class="noise"></div>

<div class="wrapper">
    <div class="navbar">
        <div class="logo"><i class="fas fa-moon" style="margin-right: 8px;"></i> MOON // NEBULA</div>
        <div class="admin-badge" onclick="authAdmin()">
            <i class="fas fa-lock"></i> ADMIN CORE
        </div>
    </div>

    <div class="dashboard">
        <!-- Sohbet Paneli -->
        <div class="glass-card">
            <div class="card-header">
                <i class="fas fa-comet"></i>
                <h2>✦ ETERNAL CHAT ✦</h2>
                <div style="margin-left: auto; font-size: 11px; background:rgba(0,0,0,0.4); padding:4px 14px; border-radius:40px;">
                    <span class="live-dot"></span> canlı
                </div>
            </div>
            <div class="card-body">
                <div id="chatFlow" class="chat-area"></div>
                <div class="input-row">
                    <input type="text" id="chatName" placeholder="CALLSIGN" class="input-neon nick-input" maxlength="20" value="STRANGER">
                    <input type="text" id="chatText" placeholder="Mesajını gönder..." class="input-neon msg-input">
                    <button class="glow-btn" onclick="sendMsg()"><i class="fas fa-bolt"></i> GÖNDER</button>
                </div>
                <div style="font-size: 10px; margin-top: 14px; text-align:center; opacity:0.45;">
                    <i class="fas fa-shield-alt"></i> nebula iletişim protokolü
                </div>
            </div>
        </div>

        <!-- Başvuru Paneli -->
        <div class="glass-card">
            <div class="card-header">
                <i class="fas fa-user-astronaut"></i>
                <h2>✦ KADRO BAŞVURU ✦</h2>
            </div>
            <div class="card-body">
                <form id="staffForm">
                    <input type="text" id="rName" placeholder="ROBLOX KULLANICI ADI" class="staff-field" required>
                    <textarea id="rWhy" placeholder="Neden Moon Games? Yeteneklerin, tecrüben, motivasyonun..." rows="4" class="staff-field" required></textarea>
                    <button type="submit" class="glow-btn full-btn"><i class="fas fa-paper-plane"></i> BAŞVURUYU GÖNDER</button>
                </form>
                <div style="margin-top: 18px; font-size:12px; background:rgba(244,191,8,0.1); border-radius:22px; padding:12px; text-align:center;">
                    <i class="fas fa-crown"></i> Ay'ın koruyucuları arasına katıl
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Gizli Panel (Başvuru listesi) -->
    <div id="adminPanel" class="admin-panel">
        <div class="card-header" style="border-bottom: 1px solid rgba(244,191,8,0.3);">
            <i class="fas fa-database"></i>
            <h2 style="color:#f4bf08;">BAŞVURU LOGLARI</h2>
        </div>
        <div id="adminContent" class="apps-container">
            <!-- başvurular dinamik listelenecek -->
        </div>
    </div>
    <div class="footer-note">
        <i class="fas fa-globe"></i> MOON GAMES // ETERNAL NEBULA — güvenli & şeffaf
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase yapılandırması (senin orijinal bilgilerin)
    const firebaseConfig = {
        apiKey: "AIzaSyDkLKenWijQCm00UwdNmrZtRzJWA0nw8yo",
        authDomain: "moongameshub-23c01.firebaseapp.com",
        databaseURL: "https://moongameshub-23c01-default-rtdb.firebaseio.com",
        projectId: "moongameshub-23c01",
        storageBucket: "moongameshub-23c01.firebasestorage.app",
        messagingSenderId: "491534485312",
        appId: "1:491534485312:web:19fd3a4f0b306b9bcddca5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const appsRef = ref(db, 'apps');

    // XSS koruması
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Nickname localstorage
    let currentUser = localStorage.getItem('moon_nick') || 'STRANGER';
    const nickInput = document.getElementById('chatName');
    nickInput.value = currentUser;
    nickInput.addEventListener('change', (e) => {
        let newVal = e.target.value.trim();
        if (newVal === "") newVal = "STRANGER";
        currentUser = newVal;
        localStorage.setItem('moon_nick', currentUser);
    });

    // Zaman formatı
    function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    // MESAJLARI DİNLE (canlı)
    onChildAdded(messagesRef, (snap) => {
        const data = snap.val();
        if (!data) return;
        const chatContainer = document.getElementById('chatFlow');
        const msgDiv = document.createElement('div');
        const isMe = (data.user === currentUser);
        msgDiv.className = `message ${isMe ? 'msg-me' : 'msg-other'}`;
        
        const nameLine = `<div class="msg-name">
                            <span><i class="fas ${isMe ? 'fa-user-astronaut' : 'fa-user'}" style="font-size:9px;"></i> ${escapeHtml(data.user)}</span>
                            <span class="msg-time">${formatTime(data.ts)}</span>
                          </div>`;
        const textLine = `<div class="msg-text">${escapeHtml(data.msg)}</div>`;
        msgDiv.innerHTML = nameLine + textLine;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    // Mesaj gönderme
    window.sendMsg = function() {
        const nameField = document.getElementById('chatName').value.trim();
        const finalName = nameField === "" ? "STRANGER" : nameField;
        if (finalName !== currentUser) {
            currentUser = finalName;
            localStorage.setItem('moon_nick', currentUser);
        }
        const msgText = document.getElementById('chatText').value.trim();
        if (msgText === "") return;
        push(messagesRef, {
            user: finalName,
            msg: msgText,
            ts: Date.now()
        }).then(() => {
            document.getElementById('chatText').value = '';
        }).catch(err => console.warn("Firebase hata:", err));
    };

    // Enter ile gönderme
    document.getElementById('chatText')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMsg();
    });

    // BAŞVURU FORMU
    const staffForm = document.getElementById('staffForm');
    staffForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const robloxUser = document.getElementById('rName').value.trim();
        const reason = document.getElementById('rWhy').value.trim();
        if (!robloxUser || !reason) {
            alert("❌ Lütfen tüm alanları doldur!");
            return;
        }
        push(appsRef, {
            user: robloxUser,
            why: reason,
            time: new Date().toLocaleString('tr-TR'),
            timestamp: Date.now()
        }).then(() => {
            const btn = staffForm.querySelector('button');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> GÖNDERİLDİ!';
            setTimeout(() => { btn.innerHTML = originalHtml; }, 1800);
            staffForm.reset();
        }).catch(err => alert("Hata: " + err.message));
    });

    // ADMIN PANELİ (şifre: moon123)
    let appsListener = null;
    window.authAdmin = function() {
        const pwd = prompt("🔐 ADMIN PANELİ KRİPTO ANAHTARI");
        if (pwd === "moon123") {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'block') {
                panel.scrollIntoView({ behavior: 'smooth' });
                return;
            }
            panel.style.display = 'block';
            const adminContainer = document.getElementById('adminContent');
            adminContainer.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-pulse"></i> Başvurular yükleniyor...</div>';
            
            // Eski listener varsa temizle
            if (appsListener) {
                off(appsRef, 'child_added', appsListener);
                appsListener = null;
            }
            adminContainer.innerHTML = ''; // temizle
            
            appsListener = (snap) => {
                const appData = snap.val();
                if (!appData) return;
                const appDiv = document.createElement('div');
                appDiv.className = 'app-item';
                appDiv.innerHTML = `
                    <div><i class="fas fa-id-card"></i> <span class="app-user">${escapeHtml(appData.user)}</span> 
                    <span style="font-size:11px; opacity:0.7;">📅 ${escapeHtml(appData.time || 'bilinmiyor')}</span></div>
                    <div style="margin-top: 10px; font-size:0.85rem;">📝 ${escapeHtml(appData.why)}</div>
                `;
                adminContainer.appendChild(appDiv);
                adminContainer.scrollTop = adminContainer.scrollHeight;
            };
            onChildAdded(appsRef, appsListener);
        } else {
            alert("⛔ GEÇERSİZ ANAHTAR! YETKİ REDDEDİLDİ.");
        }
    };

    // küçük bir yıldız efekti (sadece hissiyat)
    const styleStar = document.createElement('style');
    styleStar.textContent = `
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20% 30%, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 70% 85%, #f4bf08, rgba(0,0,0,0));
            background-repeat: no-repeat;
            opacity: 0.3;
            z-index: -1;
        }
    `;
    document.head.appendChild(styleStar);
    console.log("Moon Games | Eternal Nebula aktif — chat & başvuru sistemi çevrimiçi");
</script>
</body>
</html>
