<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Hub | Key Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: #090a0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, rgba(120, 80, 255, 0.15) 0%, transparent 60%);
        }
        .container {
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(138, 43, 226, 0.2);
            width: 380px;
            animation: fadeIn 0.8s ease-in-out;
        }
        .logo { font-size: 28px; font-weight: 700; color: #a855f7; margin-bottom: 5px; text-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
        .badge { display: inline-block; background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); padding: 4px 12px; border-radius: 20px; font-size: 11px; margin-bottom: 20px; font-weight: 600; }
        .key-box {
            background: #0d0f17;
            border: 1px dashed #a855f7;
            padding: 16px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            word-break: break-all;
        }
        .btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6); }
        .footer { font-size: 11px; color: #64748b; margin-top: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌙 MOON HUB</div>
        <div class="subtitle">Official Key Generation System</div>
        <div class="badge">VALID FOR 6 HOURS</div>
        <div class="key-box" id="keyDisplay">GENERATING...</div>
        <button class="btn" onclick="copyKey()">COPY KEY</button>
        <div class="footer">Paste this key into the Moon Hub Roblox menu.</div>
    </div>

    <script>
        function generate6HourKey() {
            const timeBlock = Math.floor(Date.now() / (6 * 3600 * 1000));
            const secret = "MOON_HUB_SECRET_SALT_2026"; 
            
            let hash = 0;
            const str = timeBlock + secret;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            const keyHex = Math.abs(hash).toString(16).toUpperCase();
            return "MOON-" + keyHex;
        }

        const generatedKey = generate6HourKey();
        document.getElementById("keyDisplay").innerText = generatedKey;

        function copyKey() {
            navigator.clipboard.writeText(generatedKey);
            const btn = document.querySelector('.btn');
            btn.innerText = "COPIED!";
            btn.style.background = "#22c55e";
            setTimeout(() => {
                btn.innerText = "COPY KEY";
                btn.style.background = "linear-gradient(135deg, #a855f7, #6366f1)";
            }, 2000);
        }
    </script>
</body>
</html>
