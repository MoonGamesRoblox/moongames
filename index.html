<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Moon Hub Key Generator</title>
    <style>
        body { background: #0f0f16; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #181924; padding: 30px; border-radius: 10px; text-align: center; width: 350px; }
        input { width: 90%; padding: 10px; margin: 15px 0; background: #242536; border: none; color: #fff; border-radius: 5px; text-align: center; font-size: 16px; }
        button { background: #a855f7; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #9333ea; }
        #result { margin-top: 15px; word-break: break-all; font-family: monospace; color: #a855f7; }
    </style>
</head>
<body>

<div class="box">
    <h2>Moon Hub Key</h2>
    <input type="text" id="userId" placeholder="Roblox User ID Girin">
    <button onclick="generateKey()">Key Oluştur</button>
    <div id="result"></div>
</div>

<script>
function generateSecureToken(userId, timeBlock) {
    const secretSalt = "MOON_SECURE_TOKEN_2026_V2";
    const rawString = `${userId}_${timeBlock}_${secretSalt}`;
    
    let hash1 = 0;
    let hash2 = 5381;

    for (let i = 0; i < rawString.length; i++) {
        const char = rawString.charCodeAt(i);
        // 32 bit tamsayı sınırlarında kalması için bitwise işlemler
        hash1 = ((hash1 * 32 - hash1) + char) | 0;
        hash2 = ((hash2 * 32 + hash2) + char) | 0;
    }

    const part1 = Math.abs(hash1).toString(16).toUpperCase();
    const part2 = Math.abs(hash2).toString(16).toUpperCase();
    
    let num = BigInt(userId);
    let base36 = "";
    const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    
    if (num === 0n) {
        base36 = "0";
    } else {
        while (num > 0n) {
            base36 = chars[Number(num % 36n)] + base36;
            num = num / 36n;
        }
    }

    return "MOON-" + part1.substring(0, 4) + "-" + part2.substring(0, 4) + "-" + base36;
}

function generateKey() {
    const userId = document.getElementById("userId").value.trim();
    if (!userId) {
        alert("Lütfen geçerli bir User ID girin!");
        return;
    }
    
    const blockDuration = 6 * 3600; // 6 saatlik blok
    const currentBlock = Math.floor(Date.now() / 1000 / blockDuration);
    
    const key = generateSecureToken(userId, currentBlock);
    document.getElementById("result").innerText = key;
}
</script>

</body>
</html>
