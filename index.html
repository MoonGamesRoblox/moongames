<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Games | Global Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --yellow: #f4bf08; --dark: #121212; --border: #e2e2e2; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: #f8f9fa; }
    
    /* Navigasyon */
    .nav { max-width: 1000px; margin: 15px auto; background: white; border-radius: 50px; display: flex; justify-content: space-between; padding: 10px 25px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .nav a { text-decoration: none; color: #555; font-weight: 700; padding: 8px 15px; border-radius: 50px; }
    .nav a:hover { background: var(--yellow); color: #000; }

    /* Ana Bölümler */
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; padding: 30px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

    /* Chat Stili */
    #chatFlow { height: 300px; overflow-y: auto; border-bottom: 1px solid #eee; margin-bottom: 15px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 10px 15px; border-radius: 15px; font-size: 14px; max-width: 80%; }
    .msg-other { background: #eee; align-self: flex-start; }
    .msg-me { background: var(--yellow); align-self: flex-end; }
    .msg b { font-size: 10px; display: block; opacity: 0.6; }

    /* Admin Accordion Stili */
    #adminPanel { display: none; background: #1a1a1a; color: white; padding: 20px; border-radius: 15px; margin-top: 20px; }
    .acc-item { background: #2a2a2a; border-radius: 8px; margin-bottom: 5px; border: 1px solid #333; }
    .acc-header { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 700; }
    .acc-content { padding: 0 12px; max-height: 0; overflow: hidden; transition: 0.3s; color: #ccc; }
    .acc-item.active .acc-content { padding: 12px; max-height: 200px; border-top: 1px solid #333; }

    input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; }
    .btn { background: var(--yellow); border: none; padding: 12px 25px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <div class="nav">
    <b>Moon Games</b>
    <div class="links">
      <a href="#trading">Chat</a>
      <a href="#staff">Apply</a>
      <a href="#admin" onclick="authAdmin()">Admin</a>
    </div>
  </div>

  <div class="container">
    <div class="card" id="trading">
      <h2 data-en="Global Chat" data-tr="Küresel Sohbet">Global Chat</h2>
      <div id="chatFlow"></div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="chatName" placeholder="Name" style="width: 100px;">
        <input type="text" id="chatText" placeholder="Your message...">
        <button class="btn" onclick="sendMsg()" style="width: auto;">Send</button>
      </div>
    </div>

    <div class="card" id="staff" style="margin-top: 20px;">
      <h2 data-en="Staff Application" data-tr="Başvuru">Staff Application</h2>
      <form id="staffForm">
        <input type="text" id="rName" placeholder="Roblox User" required>
        <input type="number" id="rAge" placeholder="Age" required>
        <textarea id="rWhy" placeholder="Why you?" rows="3" required></textarea>
        <button type="submit" class="btn">Submit Application</button>
      </form>

      <div id="adminPanel">
        <h3>Applications Received</h3>
        <div id="adminContent"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Bilgilerin (Görüntüdeki Bilgilerle Eşleştirildi)
    const firebaseConfig = {
      apiKey: "AIzaSyDkLKenWijQCm00UwdNmrZtRzJWA0nw8yo",
      authDomain: "moongameshub-23c01.firebaseapp.com",
      databaseURL: "https://moongameshub-23c01-default-rtdb.firebaseio.com",
      projectId: "moongameshub-23c01",
      storageBucket: "moongameshub-23c01.firebasestorage.app",
      messagingSenderId: "491534485312",
      appId: "1:491534485312:web:19fd3a4f0b306b9bcddca5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // CHAT GÖNDER
    window.sendMsg = function() {
      const name = document.getElementById('chatName').value || 'Guest';
      const text = document.getElementById('chatText').value;
      if(text) {
        push(ref(db, 'messages'), { user: name, msg: text });
        document.getElementById('chatText').value = '';
      }
    };

    // CHAT CANLI DİNLE
    onChildAdded(ref(db, 'messages'), (snap) => {
      const data = snap.val();
      const chat = document.getElementById('chatFlow');
      const div = document.createElement('div');
      div.className = `msg ${data.user === document.getElementById('chatName').value ? 'msg-me' : 'msg-other'}`;
      div.innerHTML = `<b>${data.user}</b>${data.msg}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    });

    // BAŞVURU GÖNDER
    document.getElementById('staffForm').onsubmit = function(e) {
      e.preventDefault();
      push(ref(db, 'apps'), {
        user: document.getElementById('rName').value,
        age: document.getElementById('rAge').value,
        why: document.getElementById('rWhy').value,
        time: new Date().toLocaleString()
      });
      alert("Application sent!");
      this.reset();
    };

    // ADMIN GİRİŞİ
    window.authAdmin = function() {
      if(prompt("Password:") === "moon123") {
        document.getElementById('adminPanel').style.display = 'block';
        loadApps();
      }
    };

    function loadApps() {
      const cont = document.getElementById('adminContent');
      cont.innerHTML = ""; 
      onChildAdded(ref(db, 'apps'), (snap) => {
        const val = snap.val();
        const item = document.createElement('div');
        item.className = 'acc-item';
        item.innerHTML = `
          <div class="acc-header" onclick="this.parentElement.classList.toggle('active')">
            <span>👤 ${val.user}</span> <span>▼</span>
          </div>
          <div class="acc-content">
            <b>Age:</b> ${val.age}<br>
            <b>Reason:</b> ${val.why}<br>
            <small>${val.time}</small>
          </div>
        `;
        cont.prepend(item);
      });
    }
  </script>
</body>
</html>
