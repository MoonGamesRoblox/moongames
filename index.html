<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Hub | Secure Key System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f16] text-white flex items-center justify-center min-h-screen selection:bg-purple-500 selection:text-white">

    <div class="w-full max-w-md p-8 bg-[#181824] border border-white/5 rounded-2xl shadow-2xl backdrop-blur-xl relative overflow-hidden">
        <!-- Glow background effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">
                🌙 Moon Hub Security
            </h1>
            <p class="text-xs text-gray-400 mt-1">Encrypted Token Key System</p>
        </div>

        <!-- Form / Input Area -->
        <div class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Roblox Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your exact username..." 
                    class="w-full px-4 py-3 bg-[#111118] border border-white/10 rounded-xl text-sm focus:outline-none focus:border-purple-500 transition-all text-white placeholder-gray-600">
            </div>

            <button id="generateBtn" onclick="generateKey()" 
                class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 font-semibold text-sm rounded-xl shadow-lg shadow-purple-600/25 transition-all transform active:scale-[0.98]">
                Generate Secure Key
            </button>
            
            <p id="errorMsg" class="text-xs text-red-400 text-center hidden font-medium"></p>
        </div>

        <!-- Output Area (Hidden by default) -->
        <div id="resultArea" class="mt-6 hidden relative z-10 space-y-4 pt-6 border-t border-white/5">
            <div>
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Your Secure Token Key</span>
                <div class="flex items-center justify-between bg-[#111118] border border-purple-500/30 rounded-xl p-3">
                    <code id="keyOutput" class="text-purple-400 font-mono font-bold tracking-wider text-xs select-all">MOON-SECURE-XXXX</code>
                    <button onclick="copyKey()" class="px-3 py-1.5 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 text-xs font-semibold rounded-lg transition-all">
                        Copy
                    </button>
                </div>
            </div>

            <!-- Timer / Expiration Info -->
            <div class="bg-[#111118]/60 border border-white/5 rounded-xl p-3.5 flex items-center justify-between">
                <div>
                    <div class="text-[10px] uppercase font-bold tracking-wider text-gray-500">Security Level</div>
                    <div class="text-xs font-medium text-emerald-400 mt-0.5 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Token Verified
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] uppercase font-bold tracking-wider text-gray-500">Valid For</div>
                    <div id="timerOutput" class="text-xs font-mono font-bold text-gray-300 mt-0.5">06:00:00</div>
                </div>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="mt-8 text-center relative z-10">
            <p class="text-[11px] text-gray-500">Linked securely with your Roblox username.</p>
        </div>
    </div>

    <script>
        function generateSecureToken(username) {
            const timeBlock = Math.floor(Date.now() / (1000 * 6 * 3600)); 
            const secretSalt = "MOON_SECURE_TOKEN_2026_V2";
            
            let cleanUser = username.trim().toLowerCase();
            let rawString = cleanUser + "_" + timeBlock + "_" + secretSalt;
            let hash1 = 0, hash2 = 5381;

            for (let i = 0; i < rawString.length; i++) {
                let char = rawString.charCodeAt(i);
                hash1 = ((hash1 << 5) - hash1) + char;
                hash1 |= 0;
                hash2 = ((hash2 << 5) + hash2) + char;
                hash2 |= 0;
            }

            const part1 = Math.abs(hash1).toString(16).toUpperCase();
            const part2 = Math.abs(hash2).toString(16).toUpperCase();
            
            // Kullanıcı adını tabana dönüştür
            let userHash = 0;
            for (let i = 0; i < cleanUser.length; i++) {
                userHash = ((userHash << 5) - userHash) + cleanUser.charCodeAt(i);
                userHash |= 0;
            }
            const userToken = Math.abs(userHash).toString(36).toUpperCase();

            return "MOON-" + part1.slice(0, 4) + "-" + part2.slice(0, 4) + "-" + userToken.slice(0, 4);
        }

        function generateKey() {
            const usernameInput = document.getElementById("usernameInput").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            
            errorMsg.classList.add("hidden");

            if (!usernameInput) {
                errorMsg.innerText = "Please enter your Roblox username!";
                errorMsg.classList.remove("hidden");
                return;
            }

            const secureKey = generateSecureToken(usernameInput);

            document.getElementById("keyOutput").innerText = secureKey;
            document.getElementById("resultArea").classList.remove("hidden");
            
            startTimer();
        }

        let timerInterval = null;
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            const blockDuration = 6 * 3600;
            const nowSec = Math.floor(Date.now() / 1000);
            const nextBlockTime = Math.ceil(nowSec / blockDuration) * blockDuration;

            function update() {
                const now = Math.floor(Date.now() / 1000);
                const timeLeft = nextBlockTime - now;

                if (timeLeft <= 0) {
                    document.getElementById("timerOutput").innerText = "EXPIRED (Refresh)";
                    clearInterval(timerInterval);
                    return;
                }

                const hours = Math.floor(timeLeft / 3600);
                const minutes = Math.floor((timeLeft % 3600) / 60);
                const seconds = timeLeft % 60;

                document.getElementById("timerOutput").innerText = 
                    String(hours).padStart(2, '0') + ":" + 
                    String(minutes).padStart(2, '0') + ":" + 
                    String(seconds).padStart(2, '0');
            }

            update();
            timerInterval = setInterval(update, 1000);
        }

        function copyKey() {
            const keyText = document.getElementById("keyOutput").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 1500);
            });
        }
    </script>
</body>
</html>
