<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Hub | Key System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#0f0f16] text-white flex items-center justify-center min-h-screen selection:bg-purple-500 selection:text-white">

    <div class="w-full max-w-md p-8 bg-[#181824] border border-white/5 rounded-2xl shadow-2xl backdrop-blur-xl relative overflow-hidden">
        <!-- Glow background effect -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">
                🌙 Moon Hub Key System
            </h1>
            <p class="text-xs text-gray-400 mt-1">Dungeon Quest Reborn • Security Engine</p>
        </div>

        <!-- Form / Input Area -->
        <div class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Roblox Username</label>
                <input type="text" id="userIdInput" placeholder="Enter your Username..." 
                    class="w-full px-4 py-3 bg-[#111118] border border-white/10 rounded-xl text-sm focus:outline-none focus:border-purple-500 transition-all text-white placeholder-gray-600">
            </div>

            <button type="button" id="generateBtn" 
                class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 font-semibold text-sm rounded-xl shadow-lg shadow-purple-600/25 transition-all transform active:scale-[0.98] cursor-pointer">
                Generate / Get Key
            </button>
        </div>

        <!-- Output Area (Hidden by default) -->
        <div id="resultArea" class="mt-6 hidden relative z-10 space-y-4 pt-6 border-t border-white/5">
            <div>
                <span class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Your Active Key</span>
                <div class="flex items-center justify-between bg-[#111118] border border-purple-500/30 rounded-xl p-3">
                    <code id="keyOutput" class="text-purple-400 font-mono font-bold tracking-wider text-sm select-all">MOON-XXXX</code>
                    <button type="button" id="copyBtn" class="px-3 py-1.5 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 text-xs font-semibold rounded-lg transition-all cursor-pointer">
                        Copy
                    </button>
                </div>
            </div>

            <!-- Timer / Expiration Info -->
            <div class="bg-[#111118]/60 border border-white/5 rounded-xl p-3.5 flex items-center justify-between">
                <div>
                    <div class="text-[10px] uppercase font-bold tracking-wider text-gray-500">Key Status</div>
                    <div class="text-xs font-medium text-emerald-400 mt-0.5 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Session
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] uppercase font-bold tracking-wider text-gray-500">Time Remaining</div>
                    <div id="timerOutput" class="text-xs font-mono font-bold text-gray-300 mt-0.5">06:00:00</div>
                </div>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="mt-8 text-center relative z-10">
            <p class="text-[11px] text-gray-500">Keys automatically rotate every 6 hours for enhanced security.</p>
        </div>
    </div>

    <script>
        function computeHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function generateKey() {
            const inputField = document.getElementById("userIdInput");
            if (!inputField) return;
            
            const inputVal = inputField.value.trim().toLowerCase();
            if (!inputVal) {
                alert("Please enter a valid Roblox Username!");
                return;
            }

            const currentTime = Math.floor(Date.now() / 1000);
            const timeBlock = Math.floor(currentTime / (6 * 3600));
            const secret = "MOON_HUB_SECRET_SALT_2026";
            
            const str = timeBlock + "_" + inputVal + "_" + secret;
            const hash = computeHash(str);
            const keyHex = hash.toString(16).toUpperCase();
            const finalKey = "MOON-" + keyHex;

            const keyOutput = document.getElementById("keyOutput");
            const resultArea = document.getElementById("resultArea");

            if (keyOutput) keyOutput.innerText = finalKey;
            if (resultArea) resultArea.classList.remove("hidden");

            startTimer(timeBlock);
        }

        let timerInterval = null;
        function startTimer(timeBlock) {
            if (timerInterval) clearInterval(timerInterval);

            const blockDuration = 6 * 3600; 
            const nextBlockTime = (timeBlock + 1) * blockDuration;

            function update() {
                const now = Math.floor(Date.now() / 1000);
                const timeLeft = nextBlockTime - now;

                const timerOutput = document.getElementById("timerOutput");
                if (!timerOutput) return;

                if (timeLeft <= 0) {
                    timerOutput.innerText = "EXPIRED (Refresh)";
                    clearInterval(timerInterval);
                    return;
                }

                const hours = Math.floor(timeLeft / 3600);
                const minutes = Math.floor((timeLeft % 3600) / 60);
                const seconds = timeLeft % 60;

                timerOutput.innerText = 
                    String(hours).padStart(2, '0') + ":" + 
                    String(minutes).padStart(2, '0') + ":" + 
                    String(seconds).padStart(2, '0');
            }

            update();
            timerInterval = setInterval(update, 1000);
        }

        function copyKey() {
            const keyOutput = document.getElementById("keyOutput");
            const btn = document.getElementById("copyBtn");
            if (!keyOutput || !btn) return;

            const keyText = keyOutput.innerText;

            navigator.clipboard.writeText(keyText).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                btn.classList.add("bg-emerald-600", "text-white");
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove("bg-emerald-600", "text-white");
                }, 1500);
            }).catch(err => {
                console.error("Kopyalama başarısız:", err);
            });
        }

        // Event listener bağlama (butonun çalışmama sorununu kesin çözer)
        document.getElementById("generateBtn").addEventListener("click", generateKey);
        document.getElementById("copyBtn").addEventListener("click", copyKey);
        document.getElementById("userIdInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                generateKey();
            }
        });
    </script>
</body>
</html>
