<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Hub - 6 Hour Key Generator</title>
    <style>
        body { background: #0f0f15; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a24; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 320px; border: 1px solid #2a2a3a; }
        h2 { color: #00beff; margin-bottom: 10px; }
        p { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        .key-box { background: #0d0d12; padding: 12px; border-radius: 6px; font-size: 18px; font-weight: bold; color: #00ff75; letter-spacing: 1px; border: 1px dashed #00beff; word-break: break-all; margin-bottom: 15px; }
        button { background: #008ce6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
        button:hover { background: #0070b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌙 Moon Hub</h2>
        <p>Reklamı başarıyla geçtiniz! İşte 6 saatlik kişiye özel anahtarınız:</p>
        <div class="key-box" id="keyDisplay">Yükleniyor...</div>
        <button onclick="copyKey()">Anahtarı Kopyala</button>
    </div>

    <script>
        // 6 Saatlik Zaman Dilimi Hesabı
        function generate6HourKey() {
            const timeBlock = Math.floor(Date.now() / (6 * 3600 * 1000));
            // Sadece senin scriptinin bildiği gizli bir tuz (Salt)
            const secret = "MOON_HUB_SECRET_SALT_2026"; 
            
            let hash = 0;
            const str = timeBlock + secret;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            const keyHex = Math.abs(hash).toString(16).toUpperCase();
            return "MOON-" + keyHex;
        }

        const generatedKey = generate6HourKey();
        document.getElementById("keyDisplay").innerText = generatedKey;

        function copyKey() {
            navigator.clipboard.writeText(generatedKey);
            alert("Key kopyalandı! Roblox'taki Moon Hub menüsüne yapıştırın.");
        }
    </script>
</body>
</html>
