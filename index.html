<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Games | Yönetim & Deneyim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #f7f2e7;
      --text: #111111;
      --yellow: #f4bf08;
      --border: #f0c84a;
      --shadow: 0 10px 25px rgba(244, 191, 8, 0.18);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* Navigasyon */
    .header-wrap { position: sticky; top: 0; z-index: 1000; padding: 10px; background: rgba(244,244,244,0.8); backdrop-filter: blur(10px); }
    .nav-bar { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px 20px; border-radius: 50px; border: 2px solid var(--border); box-shadow: var(--shadow); }
    .logo img { width: 60px; height: auto; }
    .nav-links { display: flex; gap: 10px; }
    .nav-links a { padding: 10px 18px; border-radius: 20px; font-weight: 800; font-size: 14px; color: #555; transition: 0.3s; cursor: pointer; text-decoration: none; }
    .nav-links a:hover, .nav-links a.active { background: var(--yellow); color: #000; }

    /* Hero */
    .hero { padding: 80px 20px; text-align: center; background: linear-gradient(rgba(255,248,227,0.8), rgba(255,248,227,0.8)), url('https://cdn.discordapp.com/attachments/1322634269486612502/1492893276699889674/d5ee61e1-fd1c-492e-a9af-e263dd4e3724.png') center/cover; }
    .hero h1 { font-size: clamp(30px, 5vw, 60px); font-weight: 900; margin: 0; }
    .hero-btns { margin-top: 30px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    
    .btn { padding: 15px 30px; border-radius: 15px; font-weight: 800; border: none; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
    .btn-main { background: var(--yellow); color: #000; box-shadow: var(--shadow); }
    .btn-sub { background: #fff; border: 2px solid var(--border); color: #000; }
    .btn:hover { transform: translateY(-3px); }

    /* Trading Chat */
    .section { padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
    .chat-box { background: #fff; border: 2px solid var(--border); border-radius: 30px; overflow: hidden; height: 450px; display: flex; flex-direction: column; }
    .chat-msgs { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 12px; border-radius: 15px; font-size: 14px; max-width: 80%; }
    .msg-in { background: #eee; align-self: flex-start; }
    .msg-out { background: var(--yellow); align-self: flex-end; }
    .chat-input { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
    .chat-input input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }

    /* Forms */
    .form-card { background: var(--card); padding: 30px; border-radius: 30px; border: 2px solid var(--border); }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-weight: 800; margin-bottom: 5px; }
    .field input, .field textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-family: inherit; }

    /* Admin Panel */
    #adminPanel { display: none; background: #1a1a1a; color: #fff; padding: 30px; border-radius: 30px; margin-top: 20px; }
    .app-item { background: #333; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--yellow); }

    footer { text-align: center; padding: 40px; color: #777; font-weight: 700; }
  </style>
</head>
<body>

  <header class="header-wrap">
    <div class="nav-bar">
      <div class="logo">
        <img src="https://cdn.discordapp.com/attachments/1322634269486612502/1492893276699889674/d5ee61e1-fd1c-492e-a9af-e263dd4e3724.png" alt="Logo">
      </div>
      <nav class="nav-links">
        <a href="#home" class="active" data-tr="Ana Sayfa" data-en="Home">Ana Sayfa</a>
        <a href="#trade" data-tr="Takas" data-en="Trade">Takas</a>
        <a href="#staff" data-tr="Başvuru" data-en="Staff">Başvuru</a>
        <a href="#admin" onclick="unlockAdmin()" data-tr="Panel" data-en="Admin">Panel</a>
      </nav>
      <select onchange="setLanguage(this.value)" style="padding:5px; border-radius:10px; cursor:pointer;">
        <option value="tr">TR</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
      </select>
    </div>
  </header>

  <section class="hero" id="home">
    <h1 data-tr="Moon Games Dünyasına Katıl" data-en="Join Moon Games World">Moon Games Dünyasına Katıl</h1>
    <div class="hero-btns">
      <a href="https://www.roblox.com/tr/games/112991977606907/Tap-Horizons" target="_blank" class="btn btn-main" data-tr="Oyuna Git" data-en="Play Game">Oyuna Git</a>
      <a href="https://www.roblox.com/tr/communities/865404797/MoonStudioReal#!/about" target="_blank" class="btn btn-sub" data-tr="Grubumuz" data-en="Our Group">Grubumuz</a>
    </div>
  </section>

  <section class="section" id="trade">
    <h2 style="text-align:center" data-tr="Trading Sohbeti" data-en="Trading Chat">Trading Sohbeti</h2>
    <div class="chat-box">
      <div class="chat-msgs" id="chatWindow">
        <div class="msg msg-in"><b>Sistem:</b> Hoş geldin! Takas tekliflerini buraya yazabilirsin.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="userName" placeholder="Nick" style="width:80px;">
        <input type="text" id="userMsg" placeholder="Mesajın...">
        <button class="btn btn-main" onclick="sendMsg()" data-tr="Gönder" data-en="Send">Gönder</button>
      </div>
    </div>
  </section>

  <section class="section" id="staff">
    <h2 style="text-align:center" data-tr="Yetkili Başvurusu" data-en="Staff Application">Yetkili Başvurusu</h2>
    <div class="form-card">
      <form id="applyForm">
        <div class="field">
          <label data-tr="Roblox Adın" data-en="Roblox Name">Roblox Adın</label>
          <input type="text" id="fName" required>
        </div>
        <div class="field">
          <label data-tr="Yaşın" data-en="Age">Yaşın</label>
          <input type="number" id="fAge" required>
        </div>
        <div class="field">
          <label data-tr="Neden sen?" data-en="Why you?">Neden sen?</label>
          <textarea id="fWhy" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-main" style="width:100%" data-tr="Başvuruyu Yap" data-en="Apply Now">Başvuruyu Yap</button>
      </form>
    </div>
  </section>

  <section class="section" id="admin">
    <div id="adminPanel">
      <h2 data-tr="Gelen Başvurular" data-en="Applications">Gelen Başvurular</h2>
      <div id="appContainer"></div>
      <button onclick="clearData()" style="background:red; color:white; border:none; padding:10px; border-radius:10px; cursor:pointer; margin-top:10px;">Verileri Sıfırla</button>
    </div>
  </section>

  <footer>&copy; 2026 Moon Games - Built for the community.</footer>

  <script>
    // Dil Değiştirme
    function setLanguage(l) {
      document.querySelectorAll('[data-'+l+']').forEach(e => {
        e.textContent = e.getAttribute('data-'+l);
      });
    }

    // Chat
    function sendMsg() {
      const name = document.getElementById('userName').value || 'User';
      const txt = document.getElementById('userMsg').value;
      if(!txt) return;

      const win = document.getElementById('chatWindow');
      const div = document.createElement('div');
      div.className = 'msg msg-out';
      div.innerHTML = `<b>${name}:</b> ${txt}`;
      win.appendChild(div);
      document.getElementById('userMsg').value = '';
      win.scrollTop = win.scrollHeight;
    }

    // Başvuru Kaydetme (Local Storage)
    document.getElementById('applyForm').onsubmit = function(e) {
      e.preventDefault();
      const obj = {
        name: document.getElementById('fName').value,
        age: document.getElementById('fAge').value,
        why: document.getElementById('fWhy').value,
        date: new Date().toLocaleString()
      };
      const list = JSON.parse(localStorage.getItem('moonApps') || '[]');
      list.push(obj);
      localStorage.setItem('moonApps', JSON.stringify(list));
      alert("Başvuru alındı!");
      this.reset();
    };

    // Admin Paneli Açılış
    function unlockAdmin() {
      const p = prompt("Şifre:");
      if(p === "moon123") {
        document.getElementById('adminPanel').style.display = 'block';
        loadApps();
      } else {
        alert("Hatalı!");
      }
    }

    function loadApps() {
      const cont = document.getElementById('appContainer');
      const data = JSON.parse(localStorage.getItem('moonApps') || '[]');
      cont.innerHTML = data.length ? '' : 'Henüz başvuru yok.';
      data.forEach(a => {
        cont.innerHTML += `<div class="app-item"><b>${a.name} (${a.age})</b><br>${a.date}<br><i>${a.why}</i></div>`;
      });
    }

    function clearData() {
      if(confirm("Silinsin mi?")) {
        localStorage.removeItem('moonApps');
        loadApps();
      }
    }
  </script>
</body>
</html>
