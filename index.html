<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Games | Premium Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f4bf08;
      --primary-glow: rgba(244, 191, 8, 0.4);
      --bg: #0a0a0c;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
    }

    * { box-sizing: border-box; outline: none; transition: all 0.3s ease; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text);
      background-image: radial-gradient(circle at 50% -20%, #1e1e24 0%, #0a0a0c 100%);
      min-height: 100vh;
    }

    /* Navbar */
    .nav {
      position: sticky; top: 20px; z-index: 100;
      max-width: 1100px; margin: 0 auto;
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px;
    }
    .nav-brand { font-weight: 800; font-size: 20px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
    .nav-links a { 
      text-decoration: none; color: rgba(255,255,255,0.6); 
      font-weight: 600; font-size: 14px; margin-left: 20px;
    }
    .nav-links a:hover { color: var(--primary); }

    /* Container & Layout */
    .container { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
    .hero { text-align: center; margin-bottom: 80px; }
    .hero h1 { font-size: 64px; font-weight: 800; margin: 0; letter-spacing: -2px; }
    .hero span { color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }

    .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; }

    /* Card & Components */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    /* Chat Section */
    #chatFlow {
      height: 400px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
      padding-right: 10px; margin-bottom: 20px;
      scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
    }
    .msg { 
      padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 85%;
      animation: fadeIn 0.4s ease forwards;
    }
    .msg-other { background: rgba(255,255,255,0.05); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-me { background: var(--primary); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 600; }
    .msg b { display: block; font-size: 10px; margin-bottom: 4px; text-transform: uppercase; opacity: 0.7; }

    /* Inputs & Buttons */
    .input-group { display: flex; gap: 10px; }
    input, textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px; color: white;
      font-family: inherit;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
    
    .btn {
      background: var(--primary); color: #000;
      border: none; border-radius: 16px;
      padding: 14px 28px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn:hover { transform: scale(1.02); filter: brightness(1.1); }

    /* Admin Accordion */
    #adminPanel { display: none; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
    .acc-item { 
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 16px; margin-bottom: 10px; overflow: hidden;
    }
    .acc-header { padding: 16px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 700; }
    .acc-header:hover { background: rgba(255,255,255,0.08); }
    .acc-content { padding: 0 16px; max-height: 0; overflow: hidden; color: #aaa; font-size: 14px; }
    .acc-item.active .acc-content { padding: 16px; max-height: 300px; border-top: 1px solid var(--border); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="nav">
    <div class="nav-brand">MOON GAMES</div>
    <div class="nav-links">
      <a href="#trading">Trading</a>
      <a href="#staff">Apply</a>
      <a href="javascript:void(0)" onclick="authAdmin()">Panel</a>
    </div>
  </div>

  <div class="container">
    <div class="hero">
      <h1>THE <span>UNIVERSE</span> IS YOURS</h1>
      <p style="opacity: 0.5;">Trade items, join the staff, and rule the moon.</p>
    </div>

    <div class="grid">
      <div class="card" id="trading">
        <h2 style="margin-top:0">Global Trade Chat</h2>
        <div id="chatFlow"></div>
        <div class="input-group">
          <input type="text" id="chatName" placeholder="Nick" style="width: 100px;">
          <input type="text" id="chatText" placeholder="Drop a trade offer...">
          <button class="btn" onclick="sendMsg()">Send</button>
        </div>
      </div>

      <div class="card" id="staff">
        <h2 style="margin-top:0">Join the Team</h2>
        <form id="staffForm">
          <input type="text" id="rName" placeholder="Roblox Username" style="width:100%; margin-bottom:12px;" required>
          <input type="number" id="rAge" placeholder="Age" style="width:100%; margin-bottom:12px;" required>
          <textarea id="rWhy" placeholder="Why should we hire you?" rows="4" style="width:100%; margin-bottom:12px;" required></textarea>
          <button type="submit" class="btn" style="width:100%">Submit App</button>
        </form>
      </div>
    </div>

    <div id="adminPanel" class="card">
      <h2 style="color: var(--primary)">Admin Dashboard</h2>
      <div id="adminContent"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDkLKenWijQCm00UwdNmrZtRzJWA0nw8yo",
      authDomain: "moongameshub-23c01.firebaseapp.com",
      databaseURL: "https://moongameshub-23c01-default-rtdb.firebaseio.com",
      projectId: "moongameshub-23c01",
      storageBucket: "moongameshub-23c01.firebasestorage.app",
      messagingSenderId: "491534485312",
      appId: "1:491534485312:web:19fd3a4f0b306b9bcddca5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Chat Functions
    window.sendMsg = function() {
      const name = document.getElementById('chatName').value || 'Guest';
      const text = document.getElementById('chatText').value;
      if(text.trim() !== "") {
        push(ref(db, 'messages'), { user: name, msg: text, ts: Date.now() });
        document.getElementById('chatText').value = '';
      }
    };

    onChildAdded(ref(db, 'messages'), (snap) => {
      const data = snap.val();
      const chat = document.getElementById('chatFlow');
      const div = document.createElement('div');
      const isMe = data.user === document.getElementById('chatName').value;
      div.className = `msg ${isMe ? 'msg-me' : 'msg-other'}`;
      div.innerHTML = `<b>${data.user}</b>${data.msg}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    });

    // Staff Application
    document.getElementById('staffForm').onsubmit = function(e) {
      e.preventDefault();
      push(ref(db, 'apps'), {
        user: document.getElementById('rName').value,
        age: document.getElementById('rAge').value,
        why: document.getElementById('rWhy').value,
        time: new Date().toLocaleString()
      }).then(() => {
        alert("Application sent to the Moon!");
        this.reset();
      });
    };

    // Admin Access
    window.authAdmin = function() {
      if(prompt("Admin Key:") === "moon123") {
        document.getElementById('adminPanel').style.display = 'block';
        loadApps();
        window.scrollTo(0, document.body.scrollHeight);
      }
    };

    function loadApps() {
      const cont = document.getElementById('adminContent');
      cont.innerHTML = ""; 
      onChildAdded(ref(db, 'apps'), (snap) => {
        const val = snap.val();
        const item = document.createElement('div');
        item.className = 'acc-item';
        item.innerHTML = `
          <div class="acc-header" onclick="this.parentElement.classList.toggle('active')">
            <span>👤 ${val.user}</span> <span>Explore ⚡</span>
          </div>
          <div class="acc-content">
            <p><strong>Age:</strong> ${val.age}</p>
            <p><strong>Motivation:</strong> ${val.why}</p>
            <p style="font-size:10px; opacity:0.5">${val.time}</p>
          </div>
        `;
        cont.prepend(item);
      });
    }
  </script>
</body>
</html>
