<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System & Dashboard</title>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Ana Konteyner */
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Glassmorphism Kart Yapısı */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Header & Discord Butonu */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-box h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #5865F2;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        /* İstatistik Kartları Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .online .stat-icon { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .clicks .stat-icon { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .keys .stat-icon { background: rgba(168, 85, 247, 0.15); color: #a855f7; }

        .stat-info h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info .counter {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Ana İçerik / Key Al Butonu */
        .main-content {
            text-align: center;
            padding: 40px 20px;
        }

        .main-content h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .main-content p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .action-btn {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Üst Başlık ve Discord Bağlantısı -->
        <div class="glass-card header-section">
            <div class="title-box">
                <h1>Key Generation System</h1>
            </div>
            <a href="https://discord.gg/CTRZp2gJpJ" target="_blank" class="discord-btn">
                <i class="fa-brands fa-discord"></i> Discord Server
            </a>
        </div>

        <!-- İstatistik Kutuları -->
        <div class="stats-grid">
            <!-- Aktif Ziyaretçi -->
            <div class="glass-card stat-card online">
                <div class="stat-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3><span class="pulse-dot"></span>Aktif Kişi</h3>
                    <div class="counter" id="online-count">12</div>
                </div>
            </div>

            <!-- Toplam Tıklama -->
            <div class="glass-card stat-card clicks">
                <div class="stat-icon">
                    <i class="fa-solid fa-mouse-pointer"></i>
                </div>
                <div class="stat-info">
                    <h3>Toplam Tıklama</h3>
                    <div class="counter" id="clicks-count">1,420</div>
                </div>
            </div>

            <!-- Alınan Key Sayısı -->
            <div class="glass-card stat-card keys">
                <div class="stat-icon">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div class="stat-info">
                    <h3>Alınan Key</h3>
                    <div class="counter" id="keys-count">854</div>
                </div>
            </div>
        </div>

        <!-- Ana Etkileşim Alanı -->
        <div class="glass-card main-content">
            <h2>Anahtar Almak İçin Butona Tıklayın</h2>
            <p>Sistem otomatik olarak doğrulama yapıp keyinizi üretecektir.</p>
            <button class="action-btn" id="get-key-btn">Get Key</button>
        </div>
    </div>

    <!-- Canlı Sayaçlar İçin JavaScript Scripti -->
    <script>
        // Başlangıç değerleri
        let onlineUsers = 14;
        let totalClicks = 1420;
        let keysGenerated = 854;

        const onlineElem = document.getElementById('online-count');
        const clicksElem = document.getElementById('clicks-count');
        const keysElem = document.getElementById('keys-count');
        const getKeyBtn = document.getElementById('get-key-btn');

        // Sayfa tıklandığında tıklama sayısını artıralım
        document.body.addEventListener('click', (e) => {
            // Butona tıklanmadıysa sadece genel tıklamayı artır
            if(e.target !== getKeyBtn) {
                totalClicks++;
                clicksElem.innerText = totalClicks.toLocaleString();
            }
        });

        // Key Alma Butonuna Tıklandığında
        getKeyBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Genel tıklamayı çift tetiklememek için
            totalClicks++;
            keysGenerated++;
            
            clicksElem.innerText = totalClicks.toLocaleString();
            keysElem.innerText = keysGenerated.toLocaleString();

            alert("Key oluşturma işlemine yönlendiriliyorsunuz!");
        });

        // Aktif Kişi Sayısını Rastgele Güncelleme (Gerçekçi görünüm)
        setInterval(() => {
            const change = Math.floor(Math.random() * 3) - 1; // -1, 0, veya +1
            onlineUsers = Math.max(3, onlineUsers + change);
            onlineElem.innerText = onlineUsers;
        }, 4000);
    </script>
</body>
</html>
